# SPDX-License-Identifier: Apache-2.0
name: eval

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The attrset is the list. A hand-written subset drifts. vm-* guests
      # stay out of this job. docs-options is a package, so it stays last.
      - name: Evaluate the phase 1 checks and the options document
        run: |
          list=$(mktemp)
          nix eval --raw --apply '
            checks:
            builtins.concatStringsSep "\n" (
              builtins.filter (name: builtins.match "vm-.*" name == null) (
                builtins.attrNames checks
              )
            )
          ' .#checks.x86_64-linux > "$list"
          mapfile -t checks < "$list"
          rm -f "$list"
          if [ "${#checks[@]}" -eq 0 ]; then
            echo "the check set is empty" >&2
            exit 1
          fi
          args=()
          for name in "${checks[@]}"; do
            args+=(".#checks.x86_64-linux.${name}")
          done
          args+=(".#packages.x86_64-linux.docs-options")
          nix build --print-build-logs "${args[@]}"
